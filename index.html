        11: 'ရေရှည်တွင် ဓနဥစ္စာ အလွန်ခိုင်မာစွာ စုဆောင်းမိမည်။ သစ္စာရှိသော မိတ်ဆွေများ ရရှိမည်။',
        12: 'အထီးကျန် တိတ်ဆိတ်စွာ အလုပ်လုပ်ရသော နေရာများတွင် အဆင်ပြေမည်။ နိုင်ငံရပ်ခြား အကျိုးပေးသည်။'
      }
    };

    // ==========================================
    // 2. MATHEMATICAL, TIMEZONE & KP EPHEMERIS CORE
    // ==========================================
    function estimateTimezone(lat, lon) {
      lat = parseFloat(lat) || 0;
      lon = parseFloat(lon) || 0;
      // Myanmar: lat 9.5 to 28.5, lon 92.2 to 101.2 -> 6.5
      if (lat >= 9.5 && lat <= 28.5 && lon >= 92.2 && lon <= 101.2) return 6.5;
      // India & Sri Lanka -> 5.5
      if (lat >= 5.8 && lat <= 37.0 && lon >= 68.0 && lon <= 89.5) return 5.5;
      // Nepal -> 5.75
      if (lat >= 26.0 && lat <= 31.0 && lon >= 80.0 && lon <= 88.5) return 5.75;
      // Bangladesh -> 6.0
      if (lat >= 20.5 && lat <= 26.7 && lon >= 88.0 && lon <= 92.7) return 6.0;
      // Thailand, Laos, Cambodia, Vietnam, Western Indonesia -> 7.0
      if (lat >= -10.0 && lat <= 24.0 && lon >= 97.5 && lon <= 109.5) return 7.0;
      // Singapore, Malaysia, Philippines, Taiwan, Hong Kong, Macau, China (CST), Western Australia -> 8.0
      if ((lat >= 1.0 && lat <= 7.5 && lon >= 100.0 && lon <= 105.0) || // SG & West MY
          (lat >= 3.5 && lat <= 21.5 && lon >= 116.0 && lon <= 127.0) || // Philippines
          (lat >= 18.0 && lat <= 54.0 && lon >= 109.5 && lon <= 125.0) || // Eastern China / HK / TW
          (lat <= -13.0 && lat >= -35.5 && lon >= 113.0 && lon <= 129.0)) { // Western Australia
        return 8.0;
      }
      // Japan & South Korea -> 9.0
      if (lat >= 24.0 && lat <= 46.0 && lon >= 123.0 && lon <= 146.0) return 9.0;
      // UAE, Oman -> 4.0
      if (lat >= 22.0 && lat <= 26.5 && lon >= 51.0 && lon <= 60.0) return 4.0;
      // UK, Ireland, Portugal -> 0.0
      if (lat >= 36.5 && lat <= 60.0 && lon >= -10.5 && lon <= 2.0) return 0.0;
      // Central Europe (CET) -> 1.0
      if (lat >= 36.0 && lat <= 70.0 && lon > 2.0 && lon <= 22.0) return 1.0;
      // Eastern Europe (EET) -> 2.0
      if (lat >= 30.0 && lat <= 70.0 && lon > 22.0 && lon <= 35.0) return 2.0;
      // Australia Eastern (Sydney, Melbourne, Brisbane) -> 10.0
      if (lat <= -10.0 && lat >= -44.0 && lon >= 140.0 && lon <= 154.0) return 10.0;
      // Australia Central (Adelaide, Darwin) -> 9.5
      if (lat <= -11.0 && lat >= -38.0 && lon >= 129.0 && lon < 140.0) return 9.5;
      // USA & Canada
      if (lat >= 24.0 && lat <= 50.0) {
        if (lon >= -85.0 && lon <= -65.0) return -5.0; // Eastern
        if (lon >= -105.0 && lon < -85.0) return -6.0; // Central
        if (lon >= -115.0 && lon < -105.0) return -7.0; // Mountain
        if (lon >= -125.0 && lon < -115.0) return -8.0; // Pacific
      }
      // Global fallback calculated directly from longitude
      return Math.round((lon / 15.0) * 2) / 2;
    }

    function norm360(deg) {
      if (typeof deg !== 'number' || isNaN(deg)) return 0;
      let d = deg % 360;
      if (d < 0) d += 360;
      return d;
    }

    function safeAdd(arr, signIdx, val) {
      let idx = Math.floor(norm360(signIdx * 30) / 30) % 12;
      if (isNaN(idx) || idx < 0 || idx > 11) idx = 0;
      if (!arr[idx]) arr[idx] = [];
      arr[idx].push(val);
    }

    function getJulianDay(year, month, day, hour, minute, tz) {
      let y = parseInt(year, 10) || 2026;
      let m = parseInt(month, 10) || 1;
      let d = parseInt(day, 10) || 1;
      let h = parseInt(hour, 10) || 0;
      let mn = parseInt(minute, 10) || 0;
      let t = parseFloat(tz);
      if (isNaN(t)) t = 6.5;

      if (m <= 2) { y -= 1; m += 12; }
      const A = Math.floor(y / 100);
      const B = 2 - A + Math.floor(A / 4);
      const utHour = h + mn / 60.0 - t;
      return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + (utHour / 24.0) + B - 1524.5;
    }

    function getAyanamsa(jd, type) {
      if (type === 'tropical') return 0;
      const d = jd - 2451545.0;
      const lahiri = 23.85709 + (d / 365.25) * 0.013969;
      if (type === 'lahiri') return lahiri;
      if (type === 'kp') return lahiri - 0.095;
      if (type === 'raman') return 22.4105 + (d / 365.25) * 0.013969;
      return lahiri;
    }

    function getPlanetaryDignity(planet, signIdx) {
      if (['Lagna', 'Uranus', 'Neptune', 'Pluto'].indexOf(planet) !== -1 || signIdx < 0 || signIdx > 11) {
        return { label: '-', color: 'text-slate-500' };
      }

      const exaltDebil = {
        Sun: { ex: 0, deb: 6 }, Moon: { ex: 1, deb: 7 }, Mars: { ex: 9, deb: 3 },
        Mercury: { ex: 5, deb: 11 }, Jupiter: { ex: 3, deb: 9 }, Venus: { ex: 11, deb: 5 },
        Saturn: { ex: 6, deb: 0 }, Rahu: { ex: 1, deb: 7 }, Ketu: { ex: 7, deb: 1 }
      };

      if (exaltDebil[planet]) {
        if (signIdx === exaltDebil[planet].ex) return { label: 'ဥစ္စ (အထွတ်အထိပ်)', color: 'text-amber-600 font-bold' };
        if (signIdx === exaltDebil[planet].deb) return { label: 'နိစ္စ (အားလျော့)', color: 'text-rose-600 font-bold' };
      }

      const lord = RASI_LORDS[signIdx];
      if (lord === planet) return { label: 'သယံ (ကသစ်)', color: 'text-emerald-700 font-bold' };

      const rel = NATURAL_RELATIONS[planet];
      if (rel) {
        if (rel.friends.indexOf(lord) !== -1) return { label: 'မိတ်အိမ်', color: 'text-blue-600 font-medium' };
        if (rel.enemies.indexOf(lord) !== -1) return { label: 'ရန်အိမ်', color: 'text-orange-600 font-medium' };
        return { label: 'သမအိမ်', color: 'text-slate-600' };
      }
      return { label: 'သမအိမ်', color: 'text-slate-600' };
    }

    function getKPSubLordData(deg) {
      const lon = norm360(deg);
      const nakSpan = 360 / 27;
      const nakIndex = Math.floor(lon / nakSpan);
      const nakName = NAKSHATRAS[nakIndex] || 'Ashwini';
      const pada = Math.floor((lon % nakSpan) / (nakSpan / 4)) + 1;
      const starLordIdx = nakIndex % 9;
      const starLord = DASHA_LORDS[starLordIdx].name;
      const rasiIdx = Math.floor(lon / 30);
      const rasiLord = RASI_LORDS[rasiIdx];

      const remMin = (lon % nakSpan) * 60;
      let acc = 0;
      let subLord = starLord;
      let ssl = starLord;

      for (let i = 0; i < 9; i++) {
        const curIdx = (starLordIdx + i) % 9;
        const sSpan = (DASHA_LORDS[curIdx].years / 120) * 800;
        if (remMin >= acc && remMin < acc + sSpan) {
          subLord = DASHA_LORDS[curIdx].name;
          const remSSL = remMin - acc;
          let sslAcc = 0;
          for (let j = 0; j < 9; j++) {
            const sslIdx = (curIdx + j) % 9;
            const sslSpan = (DASHA_LORDS[sslIdx].years / 120) * sSpan;
            if (remSSL >= sslAcc && remSSL < sslAcc + sslSpan) {
              ssl = DASHA_LORDS[sslIdx].name;
              break;
            }
            sslAcc += sslSpan;
          }
          break;
        }
        acc += sSpan;
      }

      return {
        rasi: RASI_NAMES_EN[rasiIdx],
        rasiLord,
        nakshatra: nakName,
        pada,
        starLord,
        subLord,
        ssl
      };
    }

    function calculateNASA_JPL_Planets(jd, lat, lon, ayanamsaType, nodeType) {
      lat = parseFloat(lat) || 0;
      lon = parseFloat(lon) || 0;
      ayanamsaType = ayanamsaType || 'lahiri';
      nodeType = nodeType || 'mean';
      const d = jd - 2451545.0;
      const T = d / 36525.0;
      const ayanamsa = getAyanamsa(jd, ayanamsaType);

      const L0_sun = norm360(280.46646 + 36000.76983 * T);
      const M_sun = norm360(357.52911 + 35999.05029 * T) * (Math.PI / 180);
      const C_sun = (1.914602 - 0.004817 * T) * Math.sin(M_sun) + (0.019993 - 0.000101 * T) * Math.sin(2 * M_sun) + 0.000289 * Math.sin(3 * M_sun);
      let sunTrop = norm360(L0_sun + C_sun);

      const L_m = norm360(218.3164477 + 481267.88123421 * T);
      const D = norm360(297.8501921 + 445267.1114034 * T) * (Math.PI / 180);
      const M = norm360(357.5291092 + 35999.0502909 * T) * (Math.PI / 180);
      const Mp = norm360(134.9633964 + 477198.8675055 * T) * (Math.PI / 180);
      const F = norm360(93.2720950 + 483202.0175233 * T) * (Math.PI / 180);

      let moonTrop = L_m +
        6.288774 * Math.sin(Mp) +
        1.274027 * Math.sin(2 * D - Mp) +
        0.658314 * Math.sin(2 * D) +
        0.213618 * Math.sin(2 * Mp) -
        0.185116 * Math.sin(M) -
        0.114332 * Math.sin(2 * F) +
        0.058793 * Math.sin(2 * D - 2 * Mp) +
        0.057066 * Math.sin(2 * D - M - Mp) +
        0.053322 * Math.sin(2 * D + Mp) +
        0.045758 * Math.sin(2 * D - M);
      moonTrop = norm360(moonTrop);

      let omega = norm360(125.04452 - 1934.136261 * T + 0.0020708 * T * T);
      if (nodeType === 'true') {
        omega -= (1.4979 * Math.sin(2 * (D - F)) + 0.15 * Math.sin(M));
      }
      let rahuTrop = norm360(omega);
      let ketuTrop = norm360(rahuTrop + 180);

      function getPlanetXYZ(a0, a_dot, e0, e_dot, I0, I_dot, L0, L_dot, w0, w_dot, N0, N_dot) {
        const a = a0 + a_dot * T;
        let e = e0 + e_dot * T;
        if (e < 0.0001) e = 0.0001;
        if (e > 0.999) e = 0.999;
        const I = norm360(I0 + I_dot * T) * Math.PI / 180;
        const L = norm360(L0 + L_dot * T);
        const w = norm360(w0 + w_dot * T);
        const N = norm360(N0 + N_dot * T) * Math.PI / 180;
        const M_val = norm360(L - w);
        const M_rad = M_val * Math.PI / 180;
        let E = M_rad + e * Math.sin(M_rad);
        for (let k = 0; k < 6; k++) {
          E = E - (E - e * Math.sin(E) - M_rad) / (1 - e * Math.cos(E));
        }
        const x_prime = a * (Math.cos(E) - e);
        const y_prime = a * Math.sqrt(Math.max(0.0001, 1 - e * e)) * Math.sin(E);
        const w_rad = norm360(w - (N0 + N_dot * T)) * Math.PI / 180;
        const x = (Math.cos(w_rad) * Math.cos(N) - Math.sin(w_rad) * Math.sin(N) * Math.cos(I)) * x_prime +
                  (-Math.sin(w_rad) * Math.cos(N) - Math.cos(w_rad) * Math.sin(N) * Math.cos(I)) * y_prime;
        const y = (Math.cos(w_rad) * Math.sin(N) + Math.sin(w_rad) * Math.cos(N) * Math.cos(I)) * x_prime +
                  (-Math.sin(w_rad) * Math.sin(N) + Math.cos(w_rad) * Math.cos(N) * Math.cos(I)) * y_prime;
        return { x, y };
      }

      const earth = getPlanetXYZ(1.00000261, 0.00000562, 0.01671123, -0.00004392, -0.00001531, -0.01294668, 100.46457166, 35999.37244981, 102.93768193, 0.32327364, 0, 0);
      const toGeocentric = (pXYZ) => norm360(Math.atan2(pXYZ.y - earth.y, pXYZ.x - earth.x) * 180 / Math.PI);

      const mercury = getPlanetXYZ(0.38709927, 0.00000037, 0.20563593, 0.00001906, 7.00497902, -0.00594749, 252.25032350, 149472.67411175, 77.45779628, 0.16047689, 48.33076593, -0.12534081);
      const venus = getPlanetXYZ(0.72333566, 0.00000390, 0.00677672, -0.00004107, 3.39467605, -0.00078890, 181.97909950, 58517.81538729, 131.60246718, 0.00268329, 76.67984255, -0.27769418);
      const mars = getPlanetXYZ(1.52371034, 0.00001847, 0.09339410, 0.00007882, 1.84969142, -0.00813131, -4.55343205, 19140.30268499, -23.94362959, 0.44441088, 49.55953891, -0.29257343);
      const jupiter = getPlanetXYZ(5.20288700, -0.00011607, 0.04838624, -0.00013253, 1.30439695, -0.00183714, 34.39644051, 3034.74612775, 14.72847983, 0.21252668, 100.47390909, 0.20469106);
      const saturn = getPlanetXYZ(9.53667594, -0.00125060, 0.05386179, -0.00050991, 2.48599187, 0.00193609, 49.95424423, 1222.49362201, 92.59887831, -0.41897216, 113.66242448, -0.28867794);
      const uranus = getPlanetXYZ(19.18916464, -0.00196176, 0.04725744, -0.00004397, 0.77263783, -0.00242939, 313.23810451, 428.48202785, 170.95427630, 0.40805281, 74.01692503, 0.04240589);
      const neptune = getPlanetXYZ(30.06992276, 0.00026291, 0.00860619, 0.00002150, 1.77004347, 0.00035372, -55.12002969, 218.45945325, 44.96476227, -0.32241464, 131.78422574, -0.00508664);
      const pluto = getPlanetXYZ(39.48211675, -0.00031596, 0.24882730, 0.00005170, 17.14001206, 0.00004818, 238.92903833, 145.20780515, 224.06889900, -0.04062942, 110.30393608, -0.01183482);

      const GMST0 = norm360(280.46061837 + 360.98564736629 * d);
      const LMST = norm360(GMST0 + lon);
      const eps = (23.439291 - 0.000130042 * T) * (Math.PI / 180);
      const yAsc = Math.cos(LMST * (Math.PI / 180));
      const xAsc = -Math.sin(LMST * (Math.PI / 180)) * Math.cos(eps) - Math.tan(lat * (Math.PI / 180)) * Math.sin(eps);
      let lagnaTrop = norm360(Math.atan2(yAsc, xAsc) * (180 / Math.PI));

      const toSid = (deg) => norm360(deg - ayanamsa);

      return {
        Lagna: toSid(lagnaTrop), Sun: toSid(sunTrop), Moon: toSid(moonTrop),
        Mars: toSid(toGeocentric(mars)), Mercury: toSid(toGeocentric(mercury)),
        Jupiter: toSid(toGeocentric(jupiter)), Venus: toSid(toGeocentric(venus)),
        Saturn: toSid(toGeocentric(saturn)), Rahu: toSid(rahuTrop), Ketu: toSid(ketuTrop),
        Uranus: toSid(toGeocentric(uranus)), Neptune: toSid(toGeocentric(neptune)),
        Pluto: toSid(toGeocentric(pluto)), ayanamsaVal: ayanamsa
      };
    }

    // Placidus house cusps (tropical geometry + selected ayanamsa), returned as
    // 12 sidereal longitudes [H1..H12]. Used only by KP mode. Falls back to
    // equal houses from the Ascendant where Placidus is undefined (circumpolar).
    function calculatePlacidusCusps(jd, lat, lon, ayanamsaType) {
      lat = parseFloat(lat) || 0;
      lon = parseFloat(lon) || 0;
      const d = jd - 2451545.0;
      const T = d / 36525.0;
      const ayanamsa = getAyanamsa(jd, ayanamsaType || 'kp');
      const rad = Math.PI / 180;
      const deg = 180 / Math.PI;
      const eps = (23.439291 - 0.000130042 * T) * rad;
      const phi = lat * rad;
      const ramc = norm360(280.46061837 + 360.98564736629 * d + lon);

      const ascT = norm360(Math.atan2(Math.cos(ramc * rad), -Math.sin(ramc * rad) * Math.cos(eps) - Math.tan(phi) * Math.sin(eps)) * deg);
      const mcT = norm360(Math.atan2(Math.sin(ramc * rad), Math.cos(ramc * rad) * Math.cos(eps)) * deg);

      const lonFromRA = (ra) => norm360(Math.atan2(Math.sin(ra * rad), Math.cos(ra * rad) * Math.cos(eps)) * deg);
      const semiArc = (eclLon) => {
        const decl = Math.asin(Math.sin(eps) * Math.sin(eclLon * rad));
        const c = -Math.tan(phi) * Math.tan(decl);
        if (c < -1 || c > 1) return null;
        return Math.acos(c) * deg;
      };
      const intermediate = (raGuessOffset, offsetFn) => {
        let ecl = lonFromRA(norm360(ramc + raGuessOffset));
        for (let it = 0; it < 50; it++) {
          const dsa = semiArc(ecl);
          if (dsa === null) return null;
          const nsa = 180 - dsa;
          const next = lonFromRA(norm360(ramc + offsetFn(dsa, nsa)));
          const diff = Math.abs(((next - ecl + 540) % 360) - 180);
          ecl = next;
          if (diff < 1e-7) break;
        }
        return ecl;
      };

      const c11 = intermediate(30, (dsa) => dsa / 3);
      const c12 = intermediate(60, (dsa) => 2 * dsa / 3);
      const c2 = intermediate(120, (dsa, nsa) => dsa + nsa / 3);
      const c3 = intermediate(150, (dsa, nsa) => dsa + 2 * nsa / 3);

      const toSid = (x) => norm360(x - ayanamsa);
      if (c11 === null || c12 === null || c2 === null || c3 === null) {
        return Array.from({ length: 12 }, (_, i) => norm360(toSid(ascT) + i * 30));
      }
      const trop = [ascT, c2, c3, norm360(mcT + 180), norm360(c11 + 180), norm360(c12 + 180),
        norm360(ascT + 180), norm360(c2 + 180), norm360(c3 + 180), mcT, c11, c12];
      return trop.map(toSid);
    }

    // ==========================================
    // KP LAYER — Krishnamurti Paddhati (used ONLY when ayanamsa === 'kp')
    // Houses begin at the Placidus cusp; verdicts come from cusp sub lords
    // and significator chains. Other ayanamsa modes never call these.
    // ==========================================
    const KP_HOUSE_THEMES = ['ကိုယ်ခန္ဓာ · စရိုက် · ကျန်းမာရေး', 'ဓန · မိသားစု · စကား', 'မွေးချင်း · ရဲရင့်မှု · ဆက်သွယ်ရေး', 'မိခင် · နေအိမ် · ပစ္စည်း', 'သားသမီး · ပညာ · ဖန်တီးမှု', 'ရန်သူ · ရောဂါ · အကြွေး', 'အိမ်ထောင် · စီးပွားဖက်', 'အသက်ရှည် · အမွေ · လျှို့ဝှက်', 'ကံကြမ္မာ · ဖခင် · ဓမ္မ', 'အလုပ် · ဂုဏ်သိက္ခာ · အာဏာ', 'လာဘ် · မိတ်ဆွေ · ဆန္ဒပြည့်ဝမှု', 'နိုင်ငံခြား · ဆုံးရှုံးမှု · တရားကျင့်မှု'];
    const KP_FRUIT_SETS = { 1: [1, 2, 11], 2: [2, 11], 3: [3, 11], 4: [4, 11], 5: [5, 9, 11], 6: [6, 10, 11], 7: [2, 7, 11], 8: [8], 9: [9, 11], 10: [2, 6, 10, 11], 11: [2, 11], 12: [3, 9, 12] };

    function buildKPData(p, cusps) {
      const GRAHAS = ['Sun', 'Moon', 'Mars', 'Mercury', 'Jupiter', 'Venus', 'Saturn', 'Rahu', 'Ketu'];
      const bhavaOf = (lon) => {
        const x = norm360(lon);
        for (let h = 0; h < 12; h++) {
          const start = cusps[h];
          const span = norm360(cusps[(h + 1) % 12] - start);
          const rel = norm360(x - start);
          if (span > 0 && (rel < span || rel > 360 - 1e-7)) return h + 1;
        }
        return 1;
      };
      const starLordOf = (name) => (typeof p[name] === 'number') ? getKPSubLordData(p[name]).starLord : null;
      const occupants = Array.from({ length: 12 }, () => []);
      GRAHAS.forEach((n) => { if (typeof p[n] === 'number') occupants[bhavaOf(p[n]) - 1].push(n); });
      const cuspSign = cusps.map((c) => Math.floor(norm360(c) / 30) % 12);
      const cuspSignLord = cuspSign.map((s) => RASI_LORDS[s]);
      const cuspSubLord = cusps.map((c) => getKPSubLordData(c).subLord);
      const ownedBy = {};
      GRAHAS.forEach((n) => { ownedBy[n] = []; });
      cuspSignLord.forEach((lord, i) => { if (ownedBy[lord]) ownedBy[lord].push(i + 1); });
      const planetSig = {};
      GRAHAS.forEach((n) => {
        if (typeof p[n] !== 'number') return;

    function calculateVarga(longitude, v) {
      const safeLon = norm360(longitude);
      const sign = Math.floor(safeLon / 30) % 12;
      const deg = safeLon % 30;
      const isOdd = (sign % 2 === 0);

      let res = sign;
      if (v === 1) res = sign;
      else if (v === 2) res = (deg < 15) ? (isOdd ? 4 : 3) : (isOdd ? 3 : 4);
      else if (v === 3) res = (sign + Math.floor(deg / 10) * 4) % 12;
      else if (v === 4) res = (sign + Math.floor(deg / 7.5) * 3) % 12;
      else if (v === 5) {
        const oddArr = [0, 10, 8, 2, 6], evenArr = [1, 5, 11, 9, 7];
        const part = Math.min(4, Math.max(0, Math.floor(deg / 6)));
        res = isOdd ? oddArr[part] : evenArr[part];
      }
      else if (v === 6) res = ((isOdd ? 0 : 6) + Math.floor(deg / 5)) % 12;
      else if (v === 7) res = ((isOdd ? sign : sign + 6) + Math.floor(deg / (30 / 7))) % 12;
      else if (v === 8) {
        const start = (sign % 3 === 0) ? 0 : ((sign % 3 === 1) ? 8 : 4);
        res = (start + Math.floor(deg / 3.75)) % 12;
      }
      else if (v === 9) res = ([0, 9, 6, 3][sign % 4] + Math.floor(deg / (30 / 9))) % 12;
      else if (v === 10) res = ((isOdd ? sign : sign + 8) + Math.floor(deg / 3)) % 12;
      else if (v === 11) res = (11 - sign + Math.floor(deg / (30 / 11)) + 12) % 12;
      else if (v === 12) res = (sign + Math.floor(deg / 2.5)) % 12;
      else if (v === 16) {
        const start = (sign % 3 === 0) ? 0 : ((sign % 3 === 1) ? 4 : 8);
        res = (start + Math.floor(deg / (30 / 16))) % 12;
      }
      else if (v === 20) {
        const start = (sign % 3 === 0) ? 0 : ((sign % 3 === 1) ? 8 : 4);
        res = (start + Math.floor(deg / 1.5)) % 12;
      }
      else if (v === 24) res = ((isOdd ? 4 : 3) + Math.floor(deg / 1.25)) % 12;
      else if (v === 27) res = ([0, 3, 6, 9][sign % 4] + Math.floor(deg / (30 / 27))) % 12;
      else if (v === 30) {
        if (isOdd) {
          res = (deg < 5) ? 0 : (deg < 10 ? 10 : (deg < 18 ? 8 : (deg < 25 ? 2 : 6)));
        } else {
          res = (deg < 5) ? 1 : (deg < 12 ? 5 : (deg < 20 ? 11 : (deg < 25 ? 9 : 7)));
        }
      }
      else if (v === 40) res = ((isOdd ? 0 : 6) + Math.floor(deg / 0.75)) % 12;
      else if (v === 45) {
        const start = (sign % 3 === 0) ? 0 : ((sign % 3 === 1) ? 4 : 8);
        res = (start + Math.floor(deg / (30 / 45))) % 12;
      }
      else if (v === 60) res = ((isOdd ? sign : sign + 6) + Math.floor(deg / 0.5)) % 12;

      return ((Math.floor(res) % 12) + 12) % 12;
    }

    function calculateDashaTree(moonLong, birthDate) {
      const safeMoon = norm360(moonLong);
      const nakTotal = safeMoon / (360 / 27);
      const nakIndex = norm360(Math.floor(nakTotal));
      const lordIndex = ((nakIndex % 9) + 9) % 9;
      const mLordInitial = DASHA_LORDS[lordIndex] || DASHA_LORDS[0];
      const balanceYears = Math.max(0.01, (1 - (nakTotal - Math.floor(nakTotal))) * mLordInitial.years);
      const fmt = (d) => {
        try {
          if (!d || isNaN(d.getTime())) return '2026-01-01';
          return d.toISOString().split('T')[0];
        } catch(e) {
          return '2026-01-01';
        }
      };

      const list = [];
      let cur = (birthDate && !isNaN(birthDate.getTime())) ? new Date(birthDate.getTime()) : new Date();

      for (let i = 0; i < 9; i++) {
        const mIdx = (lordIndex + i) % 9;
        const mLord = DASHA_LORDS[mIdx] || DASHA_LORDS[0];
        const dur = (i === 0) ? balanceYears : mLord.years;
        let mEnd = new Date(cur.getTime() + dur * 365.25 * 86400000);
        const antars = [];
        let aCur = new Date(cur.getTime());
        for (let j = 0; j < 9; j++) {
          const aIdx = (mIdx + j) % 9;
          const aLord = DASHA_LORDS[aIdx] || DASHA_LORDS[0];
          const aDur = (mLord.years * aLord.years) / 120.0 * (dur / mLord.years);
          let aEnd = new Date(aCur.getTime() + aDur * 365.25 * 86400000);
          antars.push({ lord: aLord.name, start: fmt(aCur), end: fmt(aEnd) });
          aCur = aEnd;
        }
        list.push({ lord: mLord.name, years: dur.toFixed(2), start: fmt(cur), end: fmt(mEnd), antars });
        cur = mEnd;
      }
      return list;
    }

    function calculateBhavaBala(p) {

      const bhavas = [];
      for (let i = 0; i < 12; i++) {
        const rasiIdx = (lSign + i) % 12;
        const score = baseScores[i];
        bhavas.push({ house: i + 1, rasi: RASI_NAMES_EN[rasiIdx], score, rupas: (score / 60).toFixed(2), pct: Math.min(100, Math.round((score / 551.86) * 100)), desc: significations[i] });
      }
      const sorted = [...bhavas].sort((a, b) => b.score - a.score);
      bhavas.forEach((b) => { b.rank = sorted.findIndex((s) => s.house === b.house) + 1; });
      return { bhavas, sorted };
    }

    function _planetHouse(p, name) {
      if (!p || typeof p[name] !== 'number' || typeof p.Lagna !== 'number') return 1;
      const lSign = calculateVarga(p.Lagna, 1);
      const pSign = calculateVarga(p[name], 1);
      return ((pSign - lSign + 12) % 12) + 1;
    }

    function _lordOfHouse(p, h) {
      if (!p || typeof p.Lagna !== 'number') return 'Jupiter';
      const lSign = calculateVarga(p.Lagna, 1);
      const rasiIdx = ((lSign + (h - 1)) % 12 + 12) % 12;
      return RASI_LORDS[rasiIdx] || 'Jupiter';
    }

    function _planetStrength(p, name) {
      if (!p || typeof p[name] !== 'number') return 50;
      const sIdx = calculateVarga(p[name], 1);
      const dignity = getPlanetaryDignity(name, sIdx);
      if (dignity.label.includes('ဥစ္စ')) return 95;
      if (dignity.label.includes('သယံ')) return 80;
      if (dignity.label.includes('မိတ်')) return 65;
      if (dignity.label.includes('သမ')) return 50;
      if (dignity.label.includes('ရန်')) return 35;
      if (dignity.label.includes('နိစ္စ')) return 20;
      return 50;
    }

    function _activeDasha(dashaTree) {
      if (!Array.isArray(dashaTree) || dashaTree.length === 0) return null;
      const today = new Date().toISOString().split('T')[0];
      return dashaTree.find((d) => d.start <= today && d.end >= today) || dashaTree[0];
    }

    function _lordSignificatorText(p, h) {
      const lord = _lordOfHouse(p, h);
      const targetHouse = _planetHouse(p, lord);
      return `${h} တန့်အရှင် ${lord} သည် ${targetHouse} တန့်တွင် တည်ရှိသည်။`;

      if (score >= 80) return 'အလွန်ကောင်း';

      if (score >= 50) return 'အသင့်အတင့်';

    function checkAllYogas(p) {
      const y=[], h=(name)=>_planetHouse(p,name), s=(name)=>calculateVarga(p[name],1);
      const add=(name,cause,result,base,planets)=>{const avg=(planets||[]).reduce((a,k)=>a+_planetStrength(p,k),0)/Math.max(1,(planets||[]).length);const score=Math.max(1,Math.min(5,Math.round((base*0.55+avg/100*2.45))));y.push({name,cause,result,stars:'★'.repeat(score)+'☆'.repeat(5-score),strength:score,planets:planets||[]});};
      const k=[1,4,7,10];
      if([1,4,7,10].includes(h('Jupiter'))&&[3,6,8,9,11].includes(s('Jupiter'))) add('Hamsa Mahapurusha Yoga','Jupiter သည် ကိန်းအိမ်တွင် မိမိ/ဥစ္စရာသီ၌ရှိခြင်း','ပညာ၊ အကြံဉာဏ်၊ အကျင့်သီလနှင့် အာဏာဘက်တွင် ထင်ရှားနိုင်သည်။',5,['Jupiter']);
      if(k.includes(h('Venus'))&&[1,2,6,7,11].includes(s('Venus'))) add('Malavya Mahapurusha Yoga','Venus ကိန်း + မိမိ/ဥစ္စရာသီ','အနုပညာ၊ ဆွဲဆောင်မှု၊ သက်သောင့်သက်သာနှင့် ပစ္စည်းပိုင်းဆိုင်ရာ အကျိုးပေးတတ်သည်။',5,['Venus']);
      if(k.includes(h('Mars'))&&[0,7,10].includes(s('Mars'))) add('Ruchaka Mahapurusha Yoga','Mars ကိန်း + မိမိ/ဥစ္စရာသီ','ရဲရင့်မှု၊ ဆုံးဖြတ်ချက်၊ ဦးဆောင်မှုနှင့် လုပ်ဆောင်နိုင်စွမ်း တိုးစေသည်။',5,['Mars']);
      if(k.includes(h('Mercury'))&&[2,5].includes(s('Mercury'))) add('Bhadra Mahapurusha Yoga','Mercury ကိန်း + မိမိရာသီ','ဉာဏ်၊ စကား၊ စီးပွားရေးနှင့် နည်းပညာကျွမ်းကျင်မှုကို အားပေးသည်။',5,['Mercury']);
      if(k.includes(h('Saturn'))&&[6,9,10].includes(s('Saturn'))) add('Sasa Mahapurusha Yoga','Saturn ကိန်း + မိမိ/ဥစ္စရာသီ','တာဝန်ယူမှု၊ အဖွဲ့အစည်းအာဏာနှင့် အသက်ကြီးလာလေ ခိုင်မာလာလေဖြစ်စေသည်။',5,['Saturn']);
      if(s('Sun')===s('Mercury')) add('Budha-Aditya Yoga','Sun + Mercury ပူးယှဉ်ခြင်း','ဉာဏ်၊ စီမံခန့်ခွဲမှု၊ ဆက်သွယ်ရေးနှင့် analytical thinking အားကောင်းစေသည်။',3,['Sun','Mercury']);
      if(s('Moon')===s('Mars')) add('Chandra-Mangala Yoga','Moon + Mars ပူးယှဉ်ခြင်း','ငွေရှာလိုစိတ်၊ လုပ်ငန်းစွမ်းအားနှင့် စီးပွားရေးဆုံးဖြတ်ချက်ကို အားပေးနိုင်သည်။',3,['Moon','Mars']);
      if([1,4,7,10].includes(((s('Jupiter')-s('Moon')+12)%12)+1)) add('Gaja-Kesari Yoga','Jupiter သည် Moon မှ ကိန်းအိမ်တွင်ရှိခြင်း','ဉာဏ်၊ ဩဇာ၊ လူမှုအထောက်အပံ့နှင့် အခွင့်အရေးကို အားပေးနိုင်သည်။',4,['Jupiter','Moon']);
      const moonOthers=['Sun','Mars','Mercury','Jupiter','Venus','Saturn'].filter(k=>Math.abs((s(k)-s('Moon')+12)%12)===1);
      if(moonOthers.length)add('Sunapha Yoga','Moon မှ ၂ တန့်တွင် ဂြိုဟ်ရှိခြင်း','ကိုယ်ပိုင်စွမ်းရည်ဖြင့် ရလဒ်တည်ဆောက်နိုင်မှု။',3,moonOthers);
      const moonPrev=['Sun','Mars','Mercury','Jupiter','Venus','Saturn'].filter(k=>Math.abs((s(k)-s('Moon')+12)%12)===11);
      if(moonPrev.length)add('Anapha Yoga','Moon မှ ၁၂ တန့်တွင် ဂြိုဟ်ရှိခြင်း','ကိုယ်ပိုင်အရည်အချင်းနှင့် အတွင်းစွမ်းအား ထင်ရှားနိုင်သည်။',3,moonPrev);
      if(moonOthers.length&&moonPrev.length)add('Durudhara Yoga','Moon ၏ ၂/၁၂ တန့်နှစ်ဖက်တွင် ဂြိုဟ်ရှိခြင်း','အရင်းအမြစ်နှင့် အတွေ့အကြုံကို ဟန်ချက်ညီစွာ အသုံးချနိုင်မှု။',4,[...moonOthers,...moonPrev]);
      if([2,5,9,11].includes(h('Jupiter'))&&[2,5,9,11].includes(h('Venus')))add('Dhana Pattern','Jupiter/Venus သည် ဓနအိမ်များကို အားပေးခြင်း','ဝင်ငွေ၊ ပိုင်ဆိုင်မှုနှင့် အခွင့်အရေးများကို စုစည်းနိုင်သော pattern ဖြစ်သည်။',4,['Jupiter','Venus']);
      const l1=_lordOfHouse(p,1),l5=_lordOfHouse(p,5),l9=_lordOfHouse(p,9),l10=_lordOfHouse(p,10);
      if(l1&&l5&&l9&&[l5,l9].includes(l10))add('Raja Yoga Pattern','Trikona lord နှင့် Kendra lord ဆက်နွယ်မှု','အာဏာ၊ အောင်မြင်မှုနှင့် အခွင့်အရေးကို တစ်ချိန်ချိန်တွင် ထင်ရှားစေနိုင်သည်။',4,[l1,l5,l9,l10]);
      if(!moonOthers.length&&!moonPrev.length)add('Kemadruma Yoga','Moon ၏ ၂/၁၂ တန့်တွင် အဓိကဂြိုဟ်မရှိခြင်း','စိတ်ပိုင်းဆိုင်ရာ မတည်ငြိမ်မှု သို့မဟုတ် ကိုယ့်အားကိုယ်ကိုးရမှုကို ဖြစ်စေနိုင်သော်လည်း cancellation factors များကိုပါ စစ်ရမည်။',2,['Moon']);
      return y;
    }

    function generateLifeOverview(birthPlanets, ayanamsa, dashaTree, yogas) {
      if (!birthPlanets || typeof birthPlanets.Lagna !== 'number') return {netWorthTier:'',netWorthDesc:'',pillars:{},evidence:[]};
      const houses = {};
      ['Sun','Moon','Mars','Mercury','Jupiter','Venus','Saturn','Rahu','Ketu'].forEach(k=>houses[k]=_planetHouse(birthPlanets,k));
      const lord2=_lordOfHouse(birthPlanets,2), lord5=_lordOfHouse(birthPlanets,5), lord9=_lordOfHouse(birthPlanets,9), lord10=_lordOfHouse(birthPlanets,10), lord11=_lordOfHouse(birthPlanets,11);
      const wealthH=[2,5,9,11].reduce((n,h)=>n+([2,5,9,11].includes(_planetHouse(birthPlanets,_lordOfHouse(birthPlanets,h)))?1:0),0);
      const wealthPlanets=['Jupiter','Venus','Mercury','Saturn'].reduce((n,k)=>n+(_planetStrength(birthPlanets,k)/100),0);
      const dhanaYogaCount=(yogas||[]).filter(y=>/Dhana|Lakshmi|Vasumati|Chandra-Mangala|Raja/i.test(y.name)).length;
      const wealthScore=Math.round(45+wealthH*7+wealthPlanets*8+Math.min(15,dhanaYogaCount*4));
      const tier=wealthScore>=82?'ဓနတည်ဆောက်နိုင်စွမ်း အလွန်မြင့် — High Wealth Potential':wealthScore>=68?'ဓနတည်ဆောက်နိုင်စွမ်း မြင့် — Strong Wealth Potential':wealthScore>=54?'တည်ငြိမ်သော ဓနတည်ဆောက်နိုင်စွမ်း — Moderate / Buildable':'ဓနကို စနစ်တကျတည်ဆောက်ရန်လို — Variable Wealth Pattern';
      const active=_activeDasha(dashaTree);
      const wealthRoute=`၂/၅/၉/၁၁ တန့်များနှင့် ၎င်းတို့၏ အရှင်များကို အဓိကထားဖတ်ရမည်။ ${_lordSignificatorText(birthPlanets,2)} ${_lordSignificatorText(birthPlanets,11)}`;
      const pillars={
        lifePath:`လဂ် ${RASI_NAMES_MY[calculateVarga(birthPlanets.Lagna,1)]} ဖြစ်ပြီး ဘဝတိုးတက်မှုသည် “အခွင့်အရေးတစ်ကြိမ်ရခြင်း” ထက် ကိုယ်တိုင်တည်ဆောက်ပြီး အဆင့်ဆင့်တက်ခြင်းဘက်ကို ပိုညွှန်သည်။ ဂြိုဟ်အားအခြေအနေကြောင့် အကျိုးပေးသည့်အရာနှင့် အတားအဆီးကို သီးခြားဖတ်ရန်လိုသည်။`,
        career:`၁၀ တန့်နှင့် ၁၀ တန့်အရှင် ${lord10} ၏နေရာ၊ Star/Sub-Lord နှင့် လက်ရှိ ဒသာတို့ပေါင်းစပ်ဖတ်လျှင် အလုပ်အကိုင်ကံသည် “ရာထူး” တစ်ခုတည်းမဟုတ်ဘဲ ${[10,11].includes(houses[lord10])?'အာဏာ/အောင်မြင်မှုကို ကိုယ်တိုင်တည်ဆောက်နိုင်ခြင်း':'အလုပ်ပုံစံပြောင်းလဲခြင်းနှင့် အတွေ့အကြုံမှတစ်ဆင့် တက်လာခြင်း'} ပိုထင်ရှားသည်။`,
        wealth:`${wealthRoute} ဓနအကျိုးပေးအဆင့် ${wealthScore}/100 (${_factorLabel(wealthScore)}) ဖြစ်သည်။ ငွေဝင်နိုင်ခြင်းနှင့် ငွေကို ထိန်းသိမ်းနိုင်ခြင်းကို သီးခြားကြည့်ရမည်; ဒသာနှင့် Transit က trigger ဖြစ်မှ promise က အကောင်အထည်ဖော်ရန် ပိုနီးစပ်သည်။`,
        education:`၄/၅/၉ တန့်နှင့် Mercury/Jupiter ၏အားကို အခြေခံဖတ်ရမည်။ ပညာရေးတွင် အားကောင်းသောအချက်ရှိလျှင် သင်ယူနိုင်စွမ်းထက် အသုံးချနိုင်စွမ်းက နောက်ပိုင်းအကျိုးပေးကို ဆုံးဖြတ်မည်။`,
        love:`၅ တန့်သည် attraction/romance၊ ၇ တန့်သည် partnership ဖြစ်သဖြင့် နှစ်ခုကို မရောသင့်ပါ။ လက်ရှိ chart သည် ${houses.Venus===5?'ချစ်ခြင်းနှင့် ဖန်တီးမှုကို အားကောင်းစွာဖော်ပြ':'relationship ကို အခြေအနေ၊ အချိန်နှင့် နှစ်ဦးဖက်၏ရွေးချယ်မှုတို့က ပိုမိုဆုံးဖြတ်စေ'}သည်။`,
        marriage:`၇ တန့်အရှင် ${_lordOfHouse(birthPlanets,7)} နှင့် ၂/၈/၁၁ တန့်တို့ကို ဒသာ-Transit ဖြင့် activate ဖြစ်ချိန်မှာ commitment ၏အလေးချိန် ပိုတက်မည်။ Natal promise မရှိလျှင် transit တစ်ခုတည်းနဲ့ အိမ်ထောင်ဖြစ်မည်ဟု မသတ်မှတ်သင့်။`
      };
      return {netWorthTier:tier,netWorthDesc:`ဓန Potential Score ${wealthScore}/100။ ${wealthScore>=70?'ဓနတိုးတက်ရန် အခြေခံ promise ကောင်းသည်၊ သို့သော် အကျိုးပေးသည့်ကာလကို ဒသာ/Transit ဖြင့် ချိန်ရမည်။':'အမြဲတမ်းမြင့်မားမည်ဟု မဆိုနိုင်ဘဲ အချိန်ကာလနှင့် စီမံခန့်ခွဲမှုက အဓိကဖြစ်သည်။'} လက်ရှိ ${active?active.lord+' မဟာဒသာ':''} ကို trigger အဖြစ်ထည့်တွက်ထားသည်။`,pillars,evidence:[_lordSignificatorText(birthPlanets,2),_lordSignificatorText(birthPlanets,10),_lordSignificatorText(birthPlanets,11)]};
    }

    function analyzeConjunctionsAndAspects(p) {
      if (!p) return [];
      const results = [];
      const planetsList = ['Sun', 'Moon', 'Mars', 'Mercury', 'Jupiter', 'Venus', 'Saturn', 'Rahu', 'Ketu'];
      const signMap = {};

      planetsList.forEach((k) => {
        if (typeof p[k] !== 'number') return;
        const s = calculateVarga(p[k], 1);
        if (!signMap[s]) signMap[s] = [];
        signMap[s].push(k);
      });

      Object.keys(signMap).forEach((s) => {
        const list = signMap[s];
        if (list.length >= 2) {
          const names = list.map((k) => PLANET_SHORT[k] + ' (' + k + ')').join(' + ');
          let meaning = 'ဂြိုဟ်စွမ်းအင်များ ပေါင်းစပ်လှုပ်ရှားနေသော အနေအထား ဖြစ်သည်။';
          if (list.indexOf('Sun') !== -1 && list.indexOf('Mercury') !== -1) meaning = 'ဗုဒ္ဓါဒိတျ အကျိုးပေးသဖြင့် အသိဉာဏ် ထက်မြက်ပြီး စီမံခန့်ခွဲမှု ထူးချွန်စေမည်။';
          if (list.indexOf('Moon') !== -1 && list.indexOf('Mars') !== -1) meaning = 'စန္ဒြမင်္ဂလာ အကျိုးပေးသဖြင့် စီးပွားဥစ္စာ ရှာဖွေရာတွင် အထူးပေါက်မြောက် အောင်မြင်စေမည်။';
          if (list.indexOf('Jupiter') !== -1 && list.indexOf('Moon') !== -1) meaning = 'ဂဇကေသရီ အကျိုးပေးသဖြင့် ပညာဉာဏ်၊ ဩဇာအာဏာနှင့် ကျော်ကြားမှု ရရှိစေမည်။';
          if (list.indexOf('Venus') !== -1 && list.indexOf('Mercury') !== -1) meaning = 'လက္ခမီနာရာယဏ အကျိုးပေးသဖြင့် အနုပညာ၊ ဉာဏ်ပညာနှင့် စည်းစိမ်ဥစ္စာ ပြည့်စုံစေမည်။';
          results.push({
            type: 'ဂြိုဟ်ပူးယှဉ်ခြင်း (Conjunction)',
            title: names + ' [' + RASI_NAMES_EN[s] + ' အိမ်တွင် ပူးယှဉ်ခြင်း]',
            desc: meaning
          });
        }
      });

      for (let i = 0; i < planetsList.length; i++) {
        for (let j = i + 1; j < planetsList.length; j++) {
          const p1 = planetsList[i], p2 = planetsList[j];
          if (typeof p[p1] !== 'number' || typeof p[p2] !== 'number') continue;
          const s1 = calculateVarga(p[p1], 1), s2 = calculateVarga(p[p2], 1);
          if (Math.abs(s1 - s2) === 6) {
            results.push({
              type: 'သတ္တမ အပြန်အလှန်အမြင် (Mutual Aspect - 7th)',
              title: p1 + ' နှင့် ' + p2 + ' မျက်နှာချင်းဆိုင် မြင်နေခြင်း',
              desc: 'ဂြိုဟ်နှစ်လုံး အပြန်အလှန် အားပြိုင်သဟဇာတဖြစ်ကာ ဘဝကဏ္ဍနှစ်ခုကို တပြိုင်နက် ဟန်ချက်ညီအောင် လှုံ့ဆော်ပေးနေသည်။'
            });
          }
        }
      }

      if (typeof p.Jupiter === 'number') {
        const jSign = calculateVarga(p.Jupiter, 1);
        const jAsp5 = (jSign + 4) % 12, jAsp9 = (jSign + 8) % 12;
        planetsList.forEach((k) => {
          if (k === 'Jupiter' || typeof p[k] !== 'number') return;
          const s = calculateVarga(p[k], 1);
          if (s === jAsp5 || s === jAsp9) {
            results.push({
              type: 'ဂုရု အထူးအမြင် (Jupiter Benefic Aspect)',
              title: 'ကြာသပတေးက ' + k + ' ဂြိုဟ်ကို သောမအမြင်ဖြင့် မြင်ခြင်း',
              desc: k + ' ၏ အကျိုးပေးစွမ်းရည်ကို ပိုမိုမြင့်မားစေပြီး အခက်အခဲများကို ပြေပျောက်စေသော အထောက်အပံ့ ရရှိသည်။'
            });
          }
        });
      }

      return results;
    }

    function analyzeLiveTransit(birthPlanets,transitPlanets) {
      if(!birthPlanets||!transitPlanets)return {sadeSati:'',jupTransit:'',rahuTransit:'',summary:'',actions:[]};
      const moon=calculateVarga(birthPlanets.Moon,1), lag=calculateVarga(birthPlanets.Lagna,1);
      const result={};
      const sat=((calculateVarga(transitPlanets.Saturn,1)-moon+12)%12), jup=((calculateVarga(transitPlanets.Jupiter,1)-lag+12)%12)+1, rah=((calculateVarga(transitPlanets.Rahu,1)-lag+12)%12)+1;
      result.sadeSati=sat===11?'စနေသည် မွေးစန်းမတိုင်မီ ၁၂ တန့်တွင်ရှိ၍ Sade Sati အစပိုင်း။':sat===0?'စနေသည် မွေးစန်းပေါ်တွင်ရှိ၍ အလယ်ပိုင်း။':sat===1?'စနေသည် မွေးစန်း၏ ၂ တန့်တွင်ရှိ၍ နောက်ပိုင်း။':'လက်ရှိ မွေးစန်းအရ Sade Sati အဆင့်ထဲ မဝင်ပါ။';
      result.jupTransit=`ဂျူပီတာသည် လဂ်မှ ${jup} တန့်တွင်ရှိသည်။ ${[2,5,7,9,11].includes(jup)?'တိုးချဲ့မှု၊ အထောက်အပံ့နှင့် အခွင့်အရေးဘက်ကို အားပေးသည်။':'အကျိုးရလဒ်ရရန် ပြင်ဆင်မှုနှင့် စနစ်တကျလုပ်ဆောင်မှု ပိုလိုသည်။'}`;
      result.rahuTransit=`ရာဟုသည် လဂ်မှ ${rah} တန့်တွင်ရှိပြီး ${[3,6,10,11].includes(rah)?'လှုပ်ရှားမှု၊ ကွန်ယက်နှင့် အလုပ်အကိုင်ဘက်တွင် ထူးခြားသော လမ်းသစ်ဖွင့်နိုင်':'မသေချာသောအရာကို အလောတကြီး ယုံကြည်ခြင်းမပြုသင့်'}သည်။`;
      result.summary=`လက်ရှိကာလ၏ အဓိက theme သည် ${[10,11].includes(jup)?'တိုးချဲ့ခြင်းနှင့် အလုပ်အကိုင်ရလဒ်':([6,8,12].includes(jup)?'ပြင်ဆင်ခြင်း၊ အကြွေး/တာဝန်နှင့် အတွင်းပိုင်းပြောင်းလဲမှု':'အခြေခံတည်ဆောက်ခြင်း')} ဖြစ်သည်။ Transit တစ်ခုတည်းမဟုတ်ဘဲ လက်ရှိ ဒသာနှင့် natal promise ကို တွဲဖတ်ရမည်။`;
      result.actions=[jup&&[2,5,9,10,11].includes(jup)?'အခွင့်အရေးရှိသောအရာကို စာရင်းချပြီး တစ်ခုချင်းစီကို အကောင်အထည်ဖော်ပါ။':'အလျင်စလိုမလုပ်ဘဲ အချက်အလက်နှင့် အချိန်ဇယားကို စစ်ပါ။',sat>=11?'အသုံးစရိတ်၊ စိတ်ဖိစီးမှုနှင့် တာဝန်များကို ကြိုတင်စီမံပါ။':'ရေရှည်လုပ်ငန်းကို စနစ်တကျ ဆက်တည်ဆောက်ပါ။'];
      return result;
    }

    function generateLifetimeMilestones(birthDate,dashaTree,birthPlanets) {
      const by=(birthDate&& !isNaN(birthDate.getTime()))?birthDate.getFullYear():2026;
      const out=[];
      (dashaTree||[]).forEach(d=>{
        const y1=new Date(d.start).getFullYear(), y2=new Date(d.end).getFullYear();
        const lord=d.lord, h=_planetHouse(birthPlanets,lord), kp=birthPlanets[lord]!=null?getKPSubLordData(birthPlanets[lord]):null;
        const score=Math.round((_planetStrength(birthPlanets,lord)+(h?([2,5,9,10,11].includes(h)?70:50):50))/2);
        if(y2>=new Date().getFullYear() || y2>=by+18) out.push({
          phase:`${lord} မဟာဒသာ — ${h} တန့်အကြောင်းအရာ အဓိကလှုပ်ရှားမှု`,
          age:`${Math.max(0,y1-by)}–${Math.max(0,y2-by)} နှစ်`,
          yearRange:`${y1}–${y2}`,
          desc:`${lord} သည် ${h} တန့်ကို activate လုပ်သောကြောင့် ဒီကာလ၏ အဓိက theme သည် ${[2,11].includes(h)?'ငွေဝင်/ရလဒ်နှင့် လူမှုကွန်ယက်':([10].includes(h)?'အလုပ်အကိုင်၊ အာဏာနှင့် အောင်မြင်မှု':([5,7].includes(h)?'ချစ်ရေး/ဖန်တီးမှု/ပေါင်းဖက်မှု':'အတွေ့အကြုံ၊ တာဝန်နှင့် ဘဝပြောင်းလဲမှု'))} ဖြစ်နိုင်သည်။ ${kp?`Star Lord ${kp.starLord} / Sub Lord ${kp.subLord} ဖြစ်သောကြောင့် ဖြစ်ရပ်၏ အရည်အသွေးကို ထပ်မံချိန်ရမည်။`:''}`,
          score,trigger:`${lord} Dasha + ${h}H activation`
        });
      });
      return out.slice(0,12);
    }

    function generateAnnualForecast(birthDate,birthPlanets,transitPlanets,transitDate,lat,lon,ayanamsa,nodeType) {
      const now=new Date(), start=new Date(now.getFullYear(),now.getMonth(),1), months=[];
      const names=['ဇန်နဝါရီ','ဖေဖော်ဝါရီ','မတ်','ဧပြီ','မေ','ဇွန်','ဇူလိုင်','သြဂုတ်','စက်တင်ဘာ','အောက်တိုဘာ','နိုဝင်ဘာ','ဒီဇင်ဘာ'];
      for(let i=0;i<12;i++){
        const d=new Date(start.getFullYear(),start.getMonth()+i,1);
        let tp=transitPlanets;
        try {
          const jd=getJulianDay(d.getFullYear(),d.getMonth()+1,15,12,0,6.5);
          tp=calculateNASA_JPL_Planets(jd,parseFloat(lat)||16.84,parseFloat(lon)||96.17,ayanamsa,nodeType);
        } catch(e){}
        const scores={career:0,wealth:0,love:0,travel:0,pressure:0};
        [['career',10],['wealth',2],['wealth',11],['love',5],['love',7],['travel',9],['travel',12]].forEach(([k,h])=>{
          const lord=_lordOfHouse(birthPlanets,h);
          if(lord&&tp[lord]!=null){const th=_planetHouse(Object.assign({},birthPlanets,{Lagna:birthPlanets.Lagna}),lord); const ts=calculateVarga(tp[lord],1); const ns=calculateVarga(birthPlanets.Lagna,1); const dh=((ts-ns+12)%12)+1; if([2,5,9,10,11].includes(dh)) scores[k]+=2; else if([6,8,12].includes(dh)) scores[k]-=1;}
        });
        ['Jupiter','Saturn','Rahu','Ketu'].forEach(k=>{if(tp[k]!=null){const th=((calculateVarga(tp[k],1)-calculateVarga(birthPlanets.Lagna,1)+12)%12)+1;if(k==='Jupiter'&&[2,5,7,9,11].includes(th))scores.wealth+=2;if(k==='Saturn'&&[6,8,12].includes(th))scores.pressure+=2;if((k==='Rahu'||k==='Ketu')&&[5,7,8,12].includes(th))scores.pressure+=1;}});
        const max=Math.max(scores.career,scores.wealth,scores.love,scores.travel), min=Math.min(scores.career,scores.wealth,scores.love,scores.travel);
        let badge='ပုံမှန်'; if(max>=4&&scores.pressure<2)badge='အခွင့်အရေး'; else if(scores.pressure>=3)badge='သတိ'; else if(min<0)badge='နှောင့်နှေး';
        const theme=`${scores.career>=2?'အလုပ်အကိုင်ဘက်တွင် လှုပ်ရှားရန်အချိန်ရှိသည်။ ':''}${scores.wealth>=2?'ငွေကြေး/ရလဒ်ဘက်တွင် တိုးတက်နိုင်သော trigger ရှိသည်။ ':''}${scores.love>=2?'relationship နှင့် ပေါင်းသင်းဆက်ဆံရေးဘက်တွင် အခွင့်အရေးရှိသည်။ ':''}${scores.travel>=2?'ခရီး၊ နိုင်ငံခြား၊ သင်ယူမှု သို့မဟုတ် နယ်ပယ်ချဲ့ထွင်မှုကို စဉ်းစားနိုင်သည်။ ':''}${scores.pressure>=3?'တစ်ပြိုင်နက် အလွန်အကျွံဆုံးဖြတ်ခြင်းကို ရှောင်ပြီး စာချုပ်/ငွေကြေး/အချိန်ဇယားကို နှစ်ကြိမ်စစ်ပါ။':''}`;
        months.push({num:i+1,monthName:`${names[d.getMonth()]} (${d.getFullYear()})`,dateRange:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,theme:theme||'တည်ငြိမ်စွာ ဆက်လက်တည်ဆောက်ရမည့်ကာလ။',badge,badgeColor:badge==='အခွင့်အရေး'?'bg-emerald-100 text-emerald-800 font-bold':badge==='သတိ'?'bg-amber-100 text-amber-800 font-bold':'bg-slate-100 text-slate-700',scores});
      }
      return {annualCycle:`${start.getFullYear()} ${names[start.getMonth()]} မှ နောက် ၁၂ လ — Transit/Dasha synthesis`,months};
    }

    // ==========================================
    // AUTHENTIC ASHTAKOOTA (36 POINTS) & SYNASTRY
    // ==========================================
    function calculateSynastry(bPlanets, gPlanets, ayanamsa, bDate, gDate) {
      if (!bPlanets || !gPlanets || typeof bPlanets.Moon !== 'number' || typeof gPlanets.Moon !== 'number') {
        return { total: 0, verdict: 'အချက်အလက် မပြည့်စုံပါ', breakdown: [], futureWindow: null };
      }

      const bMoon = norm360(bPlanets.Moon);
      const gMoon = norm360(gPlanets.Moon);
      const bSign = Math.floor(bMoon / 30);
      const gSign = Math.floor(gMoon / 30);
      const bNak = Math.floor(bMoon / (360 / 27));
      const gNak = Math.floor(gMoon / (360 / 27));

      // 1. Varna (1 Point)
      const getVarna = (s) => ([3, 7, 11].includes(s) ? 4 : [0, 4, 8].includes(s) ? 3 : [1, 5, 9].includes(s) ? 2 : 1);
      const varnaScore = getVarna(bSign) >= getVarna(gSign) ? 1 : 0;

      // 2. Vashya (2 Points)
      const getVashyaGroup = (s) => {
        if ([0, 1].includes(s)) return 'Chatushpada';
        if ([2, 5, 6, 10].includes(s)) return 'Manava';
        if ([3, 11].includes(s)) return 'Jalachara';
        if (s === 4) return 'Vanachara';
        if (s === 7) return 'Keeta';
        return 'Chatushpada';
      };
      const bVashya = getVashyaGroup(bSign);
      const gVashya = getVashyaGroup(gSign);
      let vashyaScore = (bVashya === gVashya) ? 2 : 1;
      if ((bVashya === 'Vanachara' && gVashya === 'Chatushpada') || (bVashya === 'Keeta' && gVashya === 'Manava')) {
        vashyaScore = 0;
      }

      // 3. Tara / Dina (3 Points)
      const tara1 = ((bNak - gNak + 27) % 27 + 1) % 9;
      const tara2 = ((gNak - bNak + 27) % 27 + 1) % 9;
      const isBad1 = [3, 5, 7].includes(tara1);
      const isBad2 = [3, 5, 7].includes(tara2);
      let taraScore = (!isBad1 && !isBad2) ? 3 : (!isBad1 || !isBad2) ? 1.5 : 0;

      // 4. Yoni (4 Points)
      const YONI_ANIMALS = [
        'Horse', 'Elephant', 'Sheep', 'Serpent', 'Serpent', 'Dog', 'Cat', 'Sheep', 'Cat',
        'Rat', 'Rat', 'Cow', 'Buffalo', 'Tiger', 'Buffalo', 'Tiger', 'Deer', 'Deer',
        'Dog', 'Monkey', 'Mongoose', 'Monkey', 'Lion', 'Horse', 'Lion', 'Cow', 'Elephant'
      ];
      const bYoni = YONI_ANIMALS[bNak] || 'Horse';
      const gYoni = YONI_ANIMALS[gNak] || 'Horse';
      const enemyPairs = [
        ['Horse', 'Buffalo'], ['Elephant', 'Lion'], ['Sheep', 'Monkey'],
        ['Serpent', 'Mongoose'], ['Dog', 'Deer'], ['Cat', 'Rat'], ['Cow', 'Tiger']
      ];
      const isEnemy = enemyPairs.some(([a, b]) => (bYoni === a && gYoni === b) || (bYoni === b && gYoni === a));
      let yoniScore = (bYoni === gYoni) ? 4 : isEnemy ? 0 : 2;

      // 5. Graha Maitri (5 Points)
      const bLord = RASI_LORDS[bSign];
      const gLord = RASI_LORDS[gSign];
      let maitriScore = 2.5;
      if (bLord === gLord) {
        maitriScore = 5;
      } else {
        const bRel = NATURAL_RELATIONS[bLord];
        const gRel = NATURAL_RELATIONS[gLord];
        const bFriend = bRel && bRel.friends.includes(gLord);
        const bEnemy = bRel && bRel.enemies.includes(gLord);
        const gFriend = gRel && gRel.friends.includes(bLord);
        const gEnemy = gRel && gRel.enemies.includes(bLord);

        if (bFriend && gFriend) maitriScore = 5;
        else if ((bFriend && !gEnemy) || (gFriend && !bEnemy)) maitriScore = 4;
        else if (!bEnemy && !gEnemy) maitriScore = 3;
        else if (bEnemy && gEnemy) maitriScore = 0;
        else maitriScore = 1;
      }

      // 6. Gana (6 Points)
      const DevaNaks = [0, 4, 6, 7, 12, 14, 16, 21, 26];
      const ManushyaNaks = [1, 3, 5, 10, 11, 19, 20, 24, 25];
      const getGana = (n) => (DevaNaks.includes(n) ? 'Deva' : ManushyaNaks.includes(n) ? 'Manushya' : 'Rakshasa');
      const bGana = getGana(bNak);
      const gGana = getGana(gNak);
      let ganaScore = (bGana === gGana) ? 6 : 0;
      if (bGana === 'Deva' && gGana === 'Manushya') ganaScore = 6;
      else if (bGana === 'Manushya' && gGana === 'Deva') ganaScore = 5;
      else if (bGana === 'Deva' && gGana === 'Rakshasa') ganaScore = 1;
      else if (bGana === 'Rakshasa' && gGana === 'Deva') ganaScore = 1;

      // 7. Bhakoot (7 Points)
      const diff = ((gSign - bSign + 12) % 12) + 1;
      const isBhakootDosha = [2, 12, 6, 8, 5, 9].includes(diff);
      let bhakootScore = (!isBhakootDosha || bLord === gLord) ? 7 : 0;

      // 8. Nadi (8 Points)
      const AdiNaks = [0, 5, 6, 11, 12, 17, 18, 23, 24];
      const MadhyaNaks = [1, 4, 7, 10, 13, 16, 19, 22, 25];
      const getNadi = (n) => (AdiNaks.includes(n) ? 'Adi' : MadhyaNaks.includes(n) ? 'Madhya' : 'Antya');
      const bNadi = getNadi(bNak);
      const gNadi = getNadi(gNak);
      const nadiScore = (bNadi !== gNadi) ? 8 : 0;

      // Total Ashtakoota Sum (Strictly out of 36)
      const total = varnaScore + vashyaScore + taraScore + yoniScore + maitriScore + ganaScore + bhakootScore + nadiScore;

      const verdict = total >= 28 ? 'အလွန်မင်္ဂလာရှိသော ဇာတာတွဲဖက်မှု (Excellent — ၂၈ မှတ်နှင့်အထက်)'
                    : total >= 18 ? 'အိမ်ထောင်ပြုရန် သင့်တင့်လျောက်ပတ်သော ဇာတာ (Compatible — ၁၈ မှ ၂၇ မှတ်)'
                    : 'သတိပြုစိစစ်ရမည့် ဇာတာ (Low Compatibility / Doshas Exist — ၁၈ မှတ်အောက်)';

      const breakdown = [
        { k: '၁။ ဝဏ္ဏ (Varna)', score: varnaScore, max: 1, desc: 'ဝိညာဉ်အဆင့်အတန်းနှင့် စရိုက်သဟဇာတဖြစ်မှု' },
        { k: '၂။ ဝသျှ (Vashya)', score: vashyaScore, max: 2, desc: 'တစ်ဦးပေါ်တစ်ဦး သြဇာလွှမ်းမိုးမှုနှင့် အပြန်အလှန်လိုက်လျောမှု' },
        { k: '၃။ တာရာ (Tara/Dina)', score: taraScore, max: 3, desc: 'ကံကြမ္မာအထောက်အပံ့နှင့် ကျန်းမာသက်ရှည်မှု' },
        { k: '၄။ ယောနိ (Yoni)', score: yoniScore, max: 4, desc: 'ကာမသဟဇာတနှင့် ရုပ်ပိုင်းဆိုင်ရာ နွေးထွေးမှု' },
        { k: '၅။ ဂြဟမိတ် (Graha Maitri)', score: maitriScore, max: 5, desc: 'စိတ်နေစိတ်ထား၊ မိတ်ဆွေသဘောနှင့် ခံယူချက်တူညီမှု' },
        { k: '၆။ ဂဏ (Gana)', score: ganaScore, max: 6, desc: 'စရိုက်ဗီဇနှင့် လူနေမှုအဆင့်အတန်း လိုက်ဖက်မှု' },
        { k: '၇။ ဘကုတ (Bhakoot)', score: bhakootScore, max: 7, desc: 'မိသားစုသုခ၊ ဓနဥစ္စာနှင့် ချစ်ခင်မြတ်နိုးမှု' },
        { k: '၈။ နာဒီ (Nadi)', score: nadiScore, max: 8, desc: 'မျိုးဆက်သန့်စင်မှု၊ မျိုးရိုးဗီဇနှင့် သွေးသားသဟဇာတ' }
      ];

      const bMoonDeg = norm360(bPlanets.Moon);
      const gMoonDeg = norm360(gPlanets.Moon);
      const moonDist = Math.abs(bMoonDeg - gMoonDeg);
      const moonAspect = Math.min(moonDist, 360 - moonDist);
      const attraction = Math.min(95, Math.max(35, Math.round(50 + (yoniScore * 7) + (moonAspect < 60 ? 15 : 0))));
      const love = Math.min(95, Math.max(35, Math.round(45 + (maitriScore * 6) + (bhakootScore * 3))));
      const sexual = Math.min(95, Math.max(35, Math.round(40 + (yoniScore * 10) + (vashyaScore * 5))));

      const bDashas = calculateDashaTree(bPlanets.Moon, bDate);
      const gDashas = calculateDashaTree(gPlanets.Moon, gDate);
      const curDateStr = new Date().toISOString().split('T')[0];
      const bActive = bDashas.find(d => d.start <= curDateStr && d.end >= curDateStr) || bDashas[0];
      const gActive = gDashas.find(d => d.start <= curDateStr && d.end >= curDateStr) || gDashas[0];

      const g7Lord = _lordOfHouse(gPlanets, 7);

      const bNowGood = bActive && relLordsB.includes(bActive.lord);
      const gNowGood = gActive && relLordsG.includes(gActive.lord);
      let curDashaPct = 48 + (bNowGood ? 22 : 0) + (gNowGood ? 22 : 0);
      curDashaPct = Math.min(95, Math.max(35, curDashaPct));

      const curYear = new Date().getFullYear();
      let futureWindow = null;

      if (curDashaPct <= 76) {
        for (let yr = curYear + 1; yr <= curYear + 6; yr++) {
          const testDateStr = `${yr}-06-15`;
          const bD = bDashas.find(d => d.start <= testDateStr && d.end >= testDateStr);
          const gD = gDashas.find(d => d.start <= testDateStr && d.end >= testDateStr);
          let bAntar = null, gAntar = null;
          if (bD && bD.antars) bAntar = bD.antars.find(a => a.start <= testDateStr && a.end >= testDateStr);
          if (gD && gD.antars) gAntar = gD.antars.find(a => a.start <= testDateStr && a.end >= testDateStr);

          const bFutureTrigger = (bD && relLordsB.includes(bD.lord)) || (bAntar && relLordsB.includes(bAntar.lord));
          const gFutureTrigger = (gD && relLordsG.includes(gD.lord)) || (gAntar && relLordsG.includes(gAntar.lord));

          if (bFutureTrigger && gFutureTrigger) {
            futureWindow = {
              hasFuture: true,
              startYear: yr,
              endYear: yr + 2,
              futurePotentialPct: Math.min(95, curDashaPct + 32),
              note: `နောင် ${yr}–${yr + 2} ကာလတွင် နှစ်ဦးစလုံး၏ ဒသာ/အန္တရဒသာ၌ သောကြာ (Venus)၊ ဂျူပီတာနှင့် ၇ တန့်အရှင်များ တစ်ပြိုင်နက် activate ဖြစ်လာမည်ဖြစ်သဖြင့် ထိုအချိန်တွင် မေတ္တာရေးနှင့် အိမ်ထောင်ပြုရန် အခွင့်အလမ်း အထူးပွင့်လန်းလာပါမည်။`
            };

              hasFuture: true,
              startYear: yr,
              endYear: yr + 2,
              futurePotentialPct: Math.min(88, curDashaPct + 20),

            };
          }
        }
      }

      return {
        total,
        verdict,
        breakdown,
        attractionPct: attraction,
        lovePct: love,
        dashaRelPct: curDashaPct,
        sexualPct: sexual,
        datingTiming: `${curYear}–${curYear + 2}`,

      };
    }

    function detectPrashnaIntent(q){
      const s=(q||'').toLowerCase();
      if(/အလုပ်|ရာထူး|project|အလုပ်ရ|career|job/.test(s))return'career';
      if(/အချစ်|ချစ်သူ|ရည်းစား|relationship|marry|အိမ်ထောင်|လက်ထပ်/.test(s))return'love';
      if(/ငွေ|ပိုက်ဆံ|အကြွေး|ရမလား|ဝင်ငွေ|အမြတ်/.test(s))return'wealth';
      if(/ပျောက်|ရှာတွေ့|အခိုးခံ|သူခိုး/.test(s))return'lost';
      if(/ထီ|lottery|လောင်းကစား|ချဲ|ဂျက်ပက်/.test(s))return'lottery';
      if(/တရားရုံး|တရားစွဲ|အမှု|တရားခွင်|court|lawsuit|ပြိုင်ပွဲ/.test(s))return'court';
      if(/အိမ်|မြေ|ကား|ပစ္စည်း|ဝယ်|ရောင်း/.test(s))return'property';
      if(/ခရီး|visa|နိုင်ငံခြား|ပြည်ပ/.test(s))return'travel';
      if(/စာမေးပွဲ|ပညာ|သင်တန်း|ကျောင်း/.test(s))return'exam';
      if(/ကျန်းမာ|ရောဂါ|နာကျင်/.test(s))return'health';
      return'general';
    }

        if(kp.subLord===lord||kp.starLord===lord){score+=2;}

      if([2,5,7,9,11].includes(qMoon)){score+=8;evidence.push(`ဟူးရား Moon သည် မေးခွန်း Lagna မှ ${qMoon}H — flow ကို support လုပ်သည်။`);}

    // ---- 🌍 Astrocartography engine (verified vs Swiss Ephemeris, 2026-10-06) ----
    function acgNorm180(x) { const v = norm360(x); return v > 180 ? v - 360 : v; }
    function acgGmstDeg(jd) { return norm360(280.46061837 + 360.98564736629 * (jd - 2451545.0)); }
    function acgEclToRaDec(lamDeg, betaDeg) {
      const eps = 23.4392911 * Math.PI / 180, lam = lamDeg * Math.PI / 180, beta = betaDeg * Math.PI / 180;
      const ra = Math.atan2(Math.sin(lam) * Math.cos(eps) - Math.tan(beta) * Math.sin(eps), Math.cos(lam));
      const dec = Math.asin(Math.sin(beta) * Math.cos(eps) + Math.cos(beta) * Math.sin(eps) * Math.sin(lam));
      return { ra: norm360(ra * 180 / Math.PI), dec: dec * 180 / Math.PI };
    }
    const ACG_INCL = { Mars: [1.850, 49.56], Mercury: [7.005, 48.33], Jupiter: [1.303, 100.46], Venus: [3.395, 76.68], Saturn: [2.489, 113.66] };
    function acgPlanetBeta(name, lamDeg, tropical) {
      if (name === 'Sun' || name === 'Rahu' || name === 'Ketu') return 0;
      if (name === 'Moon') return Math.asin(Math.sin(5.145 * Math.PI / 180) * Math.sin((lamDeg - tropical.Rahu) * Math.PI / 180)) * 180 / Math.PI;
      const c = ACG_INCL[name]; if (!c) return 0;
      return Math.asin(Math.sin(c[0] * Math.PI / 180) * Math.sin((lamDeg - c[1]) * Math.PI / 180)) * 180 / Math.PI;
    }
    function computeACGLines(jd, tropical) {
      const gmst = acgGmstDeg(jd);
      const out = {};
      ['Sun', 'Moon', 'Mars', 'Mercury', 'Jupiter', 'Venus', 'Saturn', 'Rahu', 'Ketu'].forEach((name) => {
        if (typeof tropical[name] !== 'number') return;
        const lam = tropical[name];
        const beta = acgPlanetBeta(name, lam, tropical);
        const rd = acgEclToRaDec(lam, beta);
        const asc = [], dsc = [];
        for (let phi = -72; phi <= 82; phi += 3) {
          const c = -Math.tan(phi * Math.PI / 180) * Math.tan(rd.dec * Math.PI / 180);
          if (c < -1 || c > 1) continue;
          const H0 = Math.acos(c) * 180 / Math.PI;
          asc.push([phi, acgNorm180(rd.ra - H0 - gmst)]);
          dsc.push([phi, acgNorm180(rd.ra + H0 - gmst)]);
        }
        out[name] = { ra: rd.ra, dec: rd.dec, mcLon: acgNorm180(rd.ra - gmst), icLon: acgNorm180(rd.ra - gmst + 180), asc, dsc };
      });
      return out;
    }
    function acgLineDistances(entry, cityLat, cityLon) {
      const cosLat = Math.cos(cityLat * Math.PI / 180);
      const dKm = (a, b) => Math.abs(acgNorm180(a - b)) * 111.19 * cosLat;
      const at = (curve) => {
        if (!curve.length) return Infinity;
        let best = curve[0];
        for (const pt of curve) if (Math.abs(pt[0] - cityLat) < Math.abs(best[0] - cityLat)) best = pt;
        return dKm(best[1], cityLon);
      };
      return { MC: dKm(entry.mcLon, cityLon), IC: dKm(entry.icLon, cityLon), ASC: at(entry.asc), DSC: at(entry.dsc) };
    }

    function acgCityReport(acg, city) {
      const rows = [];
      Object.keys(acg).forEach((pl) => {
        const d = acgLineDistances(acg[pl], city.lat, city.lon);
        Object.keys(d).forEach((t) => { if (d[t] <= 750) rows.push({ planet: pl, type: t, km: Math.round(d[t]), text: ACG_MEANINGS[pl][t], grade: d[t] <= 160 ? 'အလွန်နီး — သက်ရောက်မှု အပြင်း' : (d[t] <= 400 ? 'နီး — သက်ရောက်မှု ရှိ' : 'အနည်းငယ် သက်ရောက်') }); });
      });
      return rows.sort((a, b) => a.km - b.km);

    // ---- 🤝 Relationship engine (အိမ်ထောင် / မိတ်ဆွေ / လုပ်ငန်း) ----
    const GANA_DEVA = [0, 4, 6, 7, 12, 14, 16, 21, 26];
    const GANA_MANUSHYA = [1, 3, 5, 10, 11, 18, 19, 23, 24];
    const ganaOf = (moonLon) => { const n = Math.floor(norm360(moonLon) / (360 / 27)) % 27; return GANA_DEVA.includes(n) ? 'Deva' : (GANA_MANUSHYA.includes(n) ? 'Manushya' : 'Rakshasa'); };
    const signOfLon = (lon) => calculateVarga(lon, 1);
    const houseInChart = (chartP, lon) => ((signOfLon(lon) - signOfLon(chartP.Lagna) + 12) % 12) + 1;

    function moonHarmony(aP, bP) {
      const lines = [];
      let score = 0;
      const aSign = signOfLon(aP.Moon), bSign = signOfLon(bP.Moon);
      const aEl = aSign % 4, bEl = bSign % 4;
      if (aEl === bEl) { score += 30; lines.push('လ ရာသီ ဓာတ်ချင်း တူသည် — စိတ် လှိုင်းချင်း တူညီမှု မြင့်'); }
      else if ((aEl === 0 && bEl === 2) || (aEl === 2 && bEl === 0) || (aEl === 1 && bEl === 3) || (aEl === 3 && bEl === 1)) { score += 22; lines.push('လ ရာသီ ဓာတ်ချင်း သဟဇာတ ဖြစ်သည် (မီး-လေ / မြေ-ရေ)'); }
      else { score += 10; lines.push('လ ရာသီ ဓာတ် မတူ — စိတ်နေစိတ်ထား ကွဲပြားမှုကို နားလည်ပေးရန် လို'); }
      const ga = ganaOf(aP.Moon), gb = ganaOf(bP.Moon);
      if (ga === gb) { score += 20; lines.push(`Gana တူသည် (${ga}) — အကျင့်စရိုက် ကိုက်ညီမှု ကောင်း`); }
      else if ((ga === 'Deva' && gb === 'Manushya') || (ga === 'Manushya' && gb === 'Deva')) { score += 12; lines.push('Gana အသင့်အတင့် ကိုက်ညီ (Deva–Manushya)'); }
      else { score += 4; lines.push('Gana ကွဲပြားသည် — စိတ်တိုမှု/ခံစားချက် ပုံစံ မတူနိုင်'); }
      const aLord = RASI_LORDS[aSign], bLord = RASI_LORDS[bSign];
      const rel = grahaRelation(aLord, bLord), rel2 = grahaRelation(bLord, aLord);
      if (rel === 'friend' || rel2 === 'friend' || aLord === bLord) { score += 18; lines.push(`လ အရှင်များ (${aLord} · ${bLord}) မိတ်ဖက် ဖြစ်သည် — စိတ်ပိုင်းဆိုင်ရာ ထောက်ခံမှု ရှိ`); }
      else if (rel === 'enemy' || rel2 === 'enemy') { score += 3; lines.push(`လ အရှင်များ (${aLord} · ${bLord}) ရန်ဖက် — အမြင် ကွဲလွဲမှု ဖြစ်လွယ်`); }
      else { score += 10; lines.push(`လ အရှင်များ (${aLord} · ${bLord}) သမ္မာ ဖြစ်သည်`); }
      const dist = (bSign - aSign + 12) % 12;
      if ([0, 3, 6, 9].includes(dist)) { score += 17; lines.push('လ ချင်း ကိန်းအိမ် အနေအထား — အပြန်အလှန် အားပေးနိုင်သော ပုံစံ'); }
      else if ([4, 8].includes(dist)) { score += 17; lines.push('လ ချင်း တြိကုဏ အနေအထား — ကံချင်း ထောက်ပံ့သော ပုံစံ'); }
      else if ([5, 7].includes(dist)) { score += 2; lines.push('လ ချင်း ၆/၈ အနေအထား — ပဋိပက္ခ ဖြစ်လွယ်သော အနေအထား၊ သည်းခံမှု လို'); }
      else { score += 8; lines.push('လ ချင်း ၂/၁၂ အနေအထား — အသင့်အတင့်'); }
      return { score: Math.min(100, score), lines };
    }

    function crossScore(ownerP, otherP, planets, goodHouses) {
      // How do OTHER's planets land in OWNER's chart houses?
      let pts = 0, hits = [];
      planets.forEach((pl) => {
        if (typeof otherP[pl] !== 'number') return;
        const h = houseInChart(ownerP, otherP[pl]);
        if (goodHouses.includes(h)) { pts += 1; hits.push(`${pl}→${h}တန့် ✓`); }
        else if ([6, 8, 12].includes(h)) { pts -= 0.5; hits.push(`${pl}→${h}တန့် ⚠`); }
      });
      const max = planets.length;
      return { score: Math.max(5, Math.min(98, Math.round(42 + (pts / Math.max(1, max)) * 58))), hits };
    }
    function lordCrossScore(aP, bP, housesA, housesB) {
      // A's house-lords placed in B's chart + B's house-lords placed in A's chart
      let good = 0, total = 0; const notes = [];
      housesA.forEach((h) => { const lord = _lordOfHouse(aP, h); total++; const hb = houseInChart(bP, aP[lord]); if ([1, 4, 5, 7, 9, 10, 11].includes(hb)) { good++; notes.push(`${lord} (A ${h}တန့်ရှင်) → B ${hb}တန့်`); } });
      housesB.forEach((h) => { const lord = _lordOfHouse(bP, h); total++; const ha = houseInChart(aP, bP[lord]); if ([1, 4, 5, 7, 9, 10, 11].includes(ha)) { good++; notes.push(`${lord} (B ${h}တန့်ရှင်) → A ${ha}တန့်`); } });
      return { score: Math.round(30 + (good / Math.max(1, total)) * 65), notes };

        const stab = lordCrossScore(aP, bP, [7], [7]);

        areas.push({ label: 'ဘဝ · ငွေကြေး ထောက်ပံ့မှု', score: wealth.score, note: wealth.notes.join(' · ') || '—' });
      } else if (mode === 'friend') {
        const talk1 = crossScore(aP, bP, ['Mercury', 'Moon'], [3, 5, 11]);
        const talk2 = crossScore(bP, aP, ['Mercury', 'Moon'], [3, 5, 11]);
        areas.push({ label: 'စိတ် လှိုင်း (Moon)', score: harmony.score, note: harmony.lines[0] });
        areas.push({ label: 'စကားပြော · အတွေးအခေါ် (Mercury)', score: Math.round((talk1.score + talk2.score) / 2), note: `A တွင် B: ${talk1.hits.join(' · ') || '—'} / B တွင် A: ${talk2.hits.join(' · ') || '—'}` });
        const fun = lordCrossScore(aP, bP, [5, 11], [5, 11]);
        areas.push({ label: 'အတူ ပျော်ရွှင် / အကျိုးမျှဝေ (၅ · ၁၁)', score: fun.score, note: fun.notes.join(' · ') || '—' });
        const trust = lordCrossScore(aP, bP, [11], [11]);
        const satRel = grahaRelation('Saturn', _lordOfHouse(aP, 11)) === 'enemy' && grahaRelation('Saturn', _lordOfHouse(bP, 11)) === 'enemy';
        areas.push({ label: 'ယုံကြည်မှု · ရေရှည် (၁၁ တန့်)', score: Math.max(10, trust.score - (satRel ? 12 : 0)), note: trust.notes.join(' · ') || '—' });
      } else {
        const partner = lordCrossScore(aP, bP, [7], [7]);
        areas.push({ label: 'ဖက်စပ် အခြေခံ (၇ တန့်)', score: partner.score, note: partner.notes.join(' · ') || '—' });
        const profit = lordCrossScore(aP, bP, [11, 2], [11, 2]);
        areas.push({ label: 'အမြတ် အလားအလာ (၁၁ · ၂)', score: profit.score, note: profit.notes.join(' · ') || '—' });
        const ops = lordCrossScore(aP, bP, [10], [10]);
        const opsCross = crossScore(aP, bP, ['Saturn', 'Mars'], [10, 11]);

        areas.push({ label: 'ဆုံးဖြတ်ချက် · အိုင်ဒီယာ (၅ · ၉)', score: idea.score, note: idea.notes.join(' · ') || '—' });

      const modeGoodHouses = mode === 'marriage' ? [2, 7, 11] : (mode === 'friend' ? [3, 5, 11] : [2, 7, 10, 11]);

        const cur = currentDashaPair(tree);

        let s = 55; const tags = [];
        if (isLord) { s += 22; tags.push(`${L} ဒဿာသည် သက်ဆိုင်ရာ အိမ်အရှင် ဖြစ်သည် ✓`); }

        if ([6, 8, 12].includes(house) && !isLord) { s -= 18; tags.push(`${L} သည် ${house} တန့်တွင် — ယခုကာလ သတိပြု ⚠`); }

        return Math.max(10, Math.min(97, s));
      };
      const dashaScoreA = dashaNote(aP, aDasha, aName);
      const dashaScoreB = dashaNote(bP, bDasha, bName);
      areas.push({ label: 'ဒဿာ ကာလ တိုက်ဆိုင်မှု (ယခု)', score: Math.round((dashaScoreA + dashaScoreB) / 2), note: 'အသေးစိတ်ကို အောက်တွင် ကြည့်ပါ' });

      const kpLines = [];
      if (kpA && kpB) {

        const check = (kp, nm) => {
          const csl = kp.cuspSubLord[cfg.cslHouse - 1];
          const sig = (kp.planetSig[csl] && kp.planetSig[csl].all) || [];
          const hits = cfg.fruit.filter((h) => sig.includes(h));

        };
        const ha = check(kpA, aName), hb = check(kpB, bName);

      }

      return { areas, total, verdictText, roles, dashaLines, kpLines, harmonyLines: harmony.lines };
    }

    function RelateTab({ ayanamsa, nodeType, savedProfiles }) {

      const [mode, setMode] = useState('business');
      const calc = (person) => {
        const iv = (v, fb) => { const n = parseInt(v, 10); return isNaN(n) ? fb : n; };
        let h24 = iv(person.h, 12) % 12; if (person.ampm === 'PM') h24 += 12;
        const y = iv(person.y, 1990), m = Math.min(12, Math.max(1, iv(person.m, 1))), d = Math.min(31, Math.max(1, iv(person.d, 1)));
        const jd = getJulianDay(y, m, d, h24, iv(person.min, 0), parseFloat(person.tz) || 6.5);
        const planets = calculateNASA_JPL_Planets(jd, parseFloat(person.lat) || 16.84, parseFloat(person.lon) || 96.17, ayanamsa, nodeType);
        const dasha = calculateDashaTree(planets.Moon, new Date(y, m - 1, d, h24, iv(person.min, 0)));
        let kp = null;
        if (ayanamsa === 'kp') { const cusps = calculatePlacidusCusps(jd, parseFloat(person.lat) || 16.84, parseFloat(person.lon) || 96.17, 'kp'); kp = buildKPData(planets, cusps); }
        return { planets, dasha, kp };
      };
      const A = calc(personA), B = calc(personB);
      const res = calculateRelationship(A.planets, B.planets, A.dasha, B.dasha, mode, A.kp, B.kp, personA.name, personB.name);

    function EastChart({ planets, transitPlanets, isOverlay, vargaNum, birthInfo, transitInfo, size = 330 }) {
      const u = size / 3;
      const lagnaSign = calculateVarga(planets ? planets.Lagna : 0, vargaNum);
      const natalBySign = [[], [], [], [], [], [], [], [], [], [], [], []];
      const transitBySign = [[], [], [], [], [], [], [], [], [], [], [], []];

      if (planets) {
        Object.keys(planets).forEach((k) => {
          if (k === 'ayanamsaVal') return;
          const s = calculateVarga(planets[k], vargaNum);
          safeAdd(natalBySign, s, PLANET_SHORT[k] + ' ' + Math.floor(norm360(planets[k]) % 30) + '°');
        });
      }
      if (isOverlay && transitPlanets) {
        Object.keys(transitPlanets).forEach((k) => {
          if (k === 'ayanamsaVal') return;
          const s = calculateVarga(transitPlanets[k], 1);
          safeAdd(transitBySign, s, PLANET_SHORT[k]);
        });
      }

    // Fullscreen Chart View Modal
    function FullscreenChartModal({ isOpen, onClose, chartType, planets, transitPlanets, isOverlay, vargaNum, birthInfo, transitInfo }) {
      const [zoom,setZoom]=useState(1);
      const [pan,setPan]=useState({x:0,y:0});
      const drag=useRef(null);
      if(!isOpen) return null;
      const reset=()=>{setZoom(1);setPan({x:0,y:0});};
      const down=(e)=>{e.currentTarget.setPointerCapture?.(e.pointerId);drag.current={x:e.clientX,y:e.clientY,px:pan.x,py:pan.y};};
      const move=(e)=>{if(!drag.current)return;setPan({x:drag.current.px+e.clientX-drag.current.x,y:drag.current.py+e.clientY-drag.current.y});};
      const up=()=>{drag.current=null;};
      const wheel=(e)=>{e.preventDefault();setZoom(z=>Math.max(.65,Math.min(3,z+(e.deltaY<0?.12:-.12))))};
      return (
        <div className="fixed inset-0 z-50 bg-slate-950/95 flex flex-col justify-center items-center p-3">
          <div className="relative bg-white p-3 rounded-2xl shadow-2xl border border-slate-300 max-w-lg w-full">
            <button onClick={onClose} className="absolute -top-3 -right-3 bg-red-600 text-white rounded-full w-8 h-8 flex items-center justify-center font-bold shadow-lg border-2 border-white z-50">✕</button>
            <div className="flex items-center justify-between pb-2">
              <div className="font-bold text-xs text-emerald-900">D-{vargaNum} ({chartType.toUpperCase()}) မျက်နှာပြင်ပြည့်</div>
              <div className="flex gap-1">
                <button onClick={()=>setZoom(z=>Math.min(3,z+.2))} className="bg-emerald-700 text-white px-2 py-1 rounded text-xs font-bold">＋</button>
                <button onClick={()=>setZoom(z=>Math.max(.65,z-.2))} className="bg-slate-700 text-white px-2 py-1 rounded text-xs font-bold">−</button>
                <button onClick={reset} className="bg-slate-200 px-2 py-1 rounded text-[10px]">Reset</button>
              </div>
            </div>
            <div className="chart-pan-area h-[68vh] min-h-[340px] flex justify-center items-center rounded-xl bg-slate-50 border border-slate-200"
              onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up} onWheel={wheel}>
              <div style={{transform:`translate(${pan.x}px,${pan.y}px) scale(${zoom})`,transformOrigin:'center center',transition:drag.current?'none':'transform .08s ease'}}>
                {chartType==='south'?<SouthChart planets={planets} transitPlanets={transitPlanets} isOverlay={isOverlay} vargaNum={vargaNum} size={320}/>:
                 chartType==='north'?<NorthChart planets={planets} transitPlanets={transitPlanets} isOverlay={isOverlay} vargaNum={vargaNum} size={320}/>:
                 <EastChart planets={planets} transitPlanets={transitPlanets} isOverlay={isOverlay} vargaNum={vargaNum} birthInfo={birthInfo} transitInfo={transitInfo} size={320}/>}
              </div>
            </div>
            <div className="text-center text-[10px] text-slate-500 pt-2">လက်နဲ့ဆွဲရွှေ့၊ Pinch/Mouse Wheel ဖြင့် Zoom လုပ်နိုင်ပါသည်။</div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 4. ERROR BOUNDARY
    // ==========================================
    class ErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, info) {
        console.error("ErrorBoundary caught:", error, info);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="p-4 m-4 bg-red-50 border border-red-200 rounded-lg text-xs space-y-2 text-red-800">
              <h3 className="font-bold text-sm">အချက်အလက် စစ်ဆေးရန် လိုအပ်ပါသည်</h3>
              <p>ထည့်သွင်းထားသော ရက်စွဲ သို့မဟုတ် ဂဏန်းတစ်ခုခု မှားယွင်းနေပါသည်။</p>
              <pre className="p-2 bg-white rounded border border-red-200 text-[10px] overflow-x-auto">
                {this.state.error ? this.state.error.toString() : ''}
              </pre>
              <button
                onClick={() => { localStorage.clear(); window.location.reload(); }}
                className="bg-red-700 text-white px-3 py-1.5 rounded font-bold mt-2 shadow"
              >
                မူလအခြေအနေသို့ ပြန်လည်စတင်မည်
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

                    </span>
                  </div>
                  <div className="flex justify-between items-center py-0.5">
                    <span className="text-slate-700 text-[11px]">ထိုကာလအတွင်း ဖြစ်နိုင်ခြေ ရာခိုင်နှုန်း:</span>
                    <span className="font-bold text-emerald-800 text-sm">{matchResult.futureWindow.futurePotentialPct}%</span>
                  </div>
                  <p className="text-slate-700 text-[11px] leading-relaxed">
                    {matchResult.futureWindow.note}
                  </p>
                </div>
              )}

              {ayanamsa === 'kp' && kpMatch && (
                <div className="bg-white border border-amber-300 p-3 rounded space-y-1 shadow-sm">
                  <div className="flex justify-between items-center">
                    <span className="font-bold text-emerald-900">KP ဇာတာတိုက် (Sub-Lord Matching)</span>
                    <span className="font-bold text-amber-700">{kpMatch.score}/100</span>
                  </div>
                  <div className="text-[11px] font-semibold text-emerald-800">{kpMatch.verdict}</div>
                  {kpMatch.lines.map((l, i) => (
                    <div key={i} className="text-[11px] text-slate-600">• {l}</div>
                  ))}
                </div>
              )}

              {/* 36 Points Table Breakdown */}
              <div className="bg-white rounded border border-slate-200 overflow-hidden text-xs shadow-sm">
                <div className="bg-slate-100 p-2 font-bold text-slate-700 border-b border-slate-200 flex justify-between">
                  <span>အဋ္ဌကုတ (၃၆) မှတ် အသေးစိတ် ခွဲခြမ်းစိတ်ဖြာချက်</span>
                  <span className="text-emerald-800">{matchResult.total} / ၃၆ မှတ်</span>
                </div>
                {matchResult.breakdown.map((b, idx) => (
                  <div key={idx} className="flex justify-between items-center p-2 border-b last:border-0 border-slate-100">
                    <div className="flex-1 pr-2">
                      <div className="font-bold text-slate-800">{b.k}</div>
                      <div className="text-[10px] text-slate-500">{b.desc}</div>
                    </div>
                    <div className="font-bold text-amber-800 whitespace-nowrap bg-amber-50 px-2 py-1 rounded border border-amber-200">
                      {b.score} / {b.max}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* FULLSCREEN MODAL */}
          <FullscreenChartModal
            isOpen={showFullscreenChart}
            onClose={() => setShowFullscreenChart(false)}
            chartType={chartStyle}
            planets={activeTab === 'transit' ? transitPlanets : birthPlanets}
            transitPlanets={transitPlanets}
            isOverlay={activeTab === 'chart' && isOverlayOn}
            vargaNum={varga}
            birthInfo={{ name: birthName, date: `${sD}.${sM}.${sY}`, time: `${birthHour}:${birthMinute} ${birthAmPm}`, city: birthPlace }}
            transitInfo={{ date: `${now.getDate()}.${now.getMonth()+1}.${now.getFullYear()}`, time: `${now.getHours()}:${now.getMinutes()}`, city: transitCity }}
          />

          {/* SAVED PROFILES MODAL */}
          {showSavedModal && (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-lg p-4 w-full max-w-xs text-xs space-y-2">
                <h3 className="font-bold text-sm text-slate-800">သိမ်းဆည်းထားသော ဇာတာရှင်များ</h3>
                <div className="max-h-60 overflow-y-auto space-y-1">
                  {savedProfiles.length === 0 ? <p className="text-slate-500">မှတ်တမ်းမရှိသေးပါ။</p> : savedProfiles.map((p) => (
                    <div key={p.id} className="flex justify-between items-center border-b py-1.5">
                      <div onClick={() => loadProfile(p)} className="cursor-pointer">
                        <div className="font-bold text-emerald-900">{p.name}</div>
                        <div className="text-[10px] text-slate-500">{p.day}/{p.month}/{p.year} {p.hour}:{p.minute} {p.ampm} (TZ: {p.tz || '6.5'})</div>
                      </div>
                      <button onClick={() => deleteProfile(p.id)} className="bg-red-600 text-white px-2 py-1 rounded text-[10px]">ဖျက်</button>
                    </div>
                  ))}
                </div>
                <button onClick={() => setShowSavedModal(false)} className="w-full bg-slate-700 text-white py-1.5 rounded font-bold mt-2">ပိတ်မည်</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    function RootApp() {
      return (
        <ErrorBoundary>
          <MainApp />
        </ErrorBoundary>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<RootApp />);
  </script>
</body>
</html>
